<body>
  <main>
    <p class="brand">Mazury<span>.</span>Holiday</p>
    <div class="rule"></div>
    <h1>Podgląd strony</h1>
    <p class="intro">Zaloguj się, aby obejrzeć roboczą wersję strony czarteru Stillo&nbsp;31.</p>
    <form id="login-form" method="post">
      <div><label for="login">Login</label><input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div><label for="password">Hasło</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button type="submit" id="open">Otwórz podgląd <span aria-hidden="true">→</span></button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <noscript>Do otwarcia zaszyfrowanego podglądu włącz JavaScript w przeglądarce.</noscript>
