<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src data:; form-action 'none'; base-uri 'none'">
  <title>Podgląd strony · Mazury.Holiday</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="__BASE___gate/login.css">
  <script src="__BASE___gate/login.js" defer></script>
</head>
<body>
  <main>
    <div class="cover">
      <div class="horizon" aria-hidden="true"><span></span></div>
      <p class="brand">Mazury.Holiday</p>
    </div>
    <section class="signin" aria-labelledby="title">
      <h1 id="title">Podgląd strony</h1>
      <p class="intro">Zaloguj się, żeby obejrzeć stronę czarteru Stillo&nbsp;31.</p>
      <form id="login-form" method="post">
        <div><label for="login">Login</label><input id="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
        <div><label for="password">Hasło</label><input id="password" type="password" autocomplete="current-password" required></div>
        <button type="submit" id="open">Otwórz podgląd</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <noscript>Do otwarcia zaszyfrowanego podglądu włącz JavaScript w przeglądarce.</noscript>
    </section>
  </main>
</body>
</html>
